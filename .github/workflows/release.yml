name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A local reusable workflow uses this tag's commit, not the default branch.
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's tested binaries (no rebuild or cross-run lookup)
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: gdebug-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Verify complete artifact set and checksum downloads
        working-directory: dist
        shell: bash
        run: |
          files=(
            gdebug-linux-x86.tar.gz
            gdebug-linux-x64.tar.gz
            gdebug-windows-x86.zip
            gdebug-windows-x64.zip
            gdebug-vscode.vsix
            gdebug-zed.tar.gz
          )
          for file in "${files[@]}"; do test -s "$file"; done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#files[@]}"
          sha256sum "${files[@]}" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$TAG" dist/* --verify-tag --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes

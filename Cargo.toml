[workspace]
resolver = "3"
members = ["crates/gdebug-proto", "crates/gdebug-module", "crates/gdebug-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
gdebug-proto = { path = "crates/gdebug-proto" }
serde_json = "1"
getrandom = "0.3"

[profile.release]
debug = "line-tables-only"
panic = "unwind"

[package]
name = "gdebug-module"
version.workspace = true
edition.workspace = true

[lib]
name = "gdebug"
crate-type = ["cdylib", "rlib"]

[features]
server = ["rsgdll/server"]
client = ["rsgdll/client"]

[dependencies]
rsgdll = { git = "https://github.com/weBj8/rsgdll.git", rev = "0a71f1bb2d6f267927135b04be6992465e4ea1ad", default-features = false }
gdebug-proto.workspace = true
serde_json.workspace = true
getrandom.workspace = true

[dev-dependencies]
libloading = "=0.9.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("menu"))'] }
